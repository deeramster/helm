variables:
  VERSION: 1.0.${CI_PIPELINE_ID}
  REPORT_PORT: 8000

stages:
  - build
  - test
  - release
  - package-chart
  - deploy
  - notify

build-backend-report:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/backend-report"
      --dockerfile "${CI_PROJECT_DIR}/backend-report/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/sausage-backend-report:$CI_COMMIT_SHA"
      --build-arg VERSION=$VERSION
      --cache=true
  only:
    changes:
      - backend-report/**/*

backend-report-test:
  stage: test
  image: golang:latest
  script:
    - cd backend-report
    - go test ./app/services/health
  needs:
    - build-backend-report
  only:
    changes:
      - backend-report/**/*

sonarqube-backend-report-sast:
  stage: test
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - cd backend-report
    - >
      sonar-scanner
      -Dsonar.qualitygate.wait=true
      -Dsonar.projectName=${SONARGO}
      -Dsonar.projectKey=${SONARGO}
      -Dsonar.sources=.
      -Dsonar.host.url=${SONARQUBE_URL}
      -Dsonar.login=${SONARGOL}
  needs:
    - build-backend-report
  allow_failure: true
  only:
    changes:
      - backend-report/**/*

release-backend-report:
  variables:
    GIT_STRATEGY: none
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  cache: []
  stage: release
  script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - crane tag $CI_REGISTRY_IMAGE/sausage-backend-report:$CI_COMMIT_SHA $VERSION
  needs: ["build-backend-report"]
  only:
    changes:
      - backend-report/**/*

package-and-upload-backend-report:
  stage: package-chart
  image: alpine/helm:latest
  needs: ["release-backend-report"]
  before_script:
    - apk add --no-cache curl gettext yq
  script:
    - |
      CHART_DIR="sausage-store-chart"
      
      # Обновляем версии в сабчарте backend-report
      yq eval ".version = \"$VERSION\"" -i ${CHART_DIR}/charts/backend-report/Chart.yaml
      yq eval ".appVersion = \"$VERSION\"" -i ${CHART_DIR}/charts/backend-report/Chart.yaml
      
      # ОБНОВЛЯЕМ ВСЕ ЗНАЧЕНИЯ В values.yaml НА ЭТОМ ШАГЕ
      yq eval ".image.repository = \"${CI_REGISTRY_IMAGE}/sausage-backend-report\"" -i ${CHART_DIR}/charts/backend-report/values.yaml
      yq eval ".image.tag = \"$VERSION\"" -i ${CHART_DIR}/charts/backend-report/values.yaml
      yq eval ".image.pullPolicy = \"IfNotPresent\"" -i ${CHART_DIR}/charts/backend-report/values.yaml
      
      # Обновляем MongoDB настройки
      yq eval ".mongo.user = \"${MONGO_USER}\"" -i ${CHART_DIR}/charts/backend-report/values.yaml
      yq eval ".mongo.password = \"${MONGO_PASSWORD}\"" -i ${CHART_DIR}/charts/backend-report/values.yaml
      yq eval ".mongo.host = \"${MONGO_HOST}\"" -i ${CHART_DIR}/charts/backend-report/values.yaml
      yq eval ".mongo.dbname = \"${MONGO_DBNAME}\"" -i ${CHART_DIR}/charts/backend-report/values.yaml
      yq eval ".mongo.port = \"${MONGO_PORT:-27017}\"" -i ${CHART_DIR}/charts/backend-report/values.yaml
      
      # Обновляем env db
      yq eval ".env.db = \"${DB}\"" -i ${CHART_DIR}/charts/backend-report/values.yaml
      
      # Обновляем imagePullSecrets
      yq eval '.imagePullSecrets[0].name = "docker-config-secret"' -i ${CHART_DIR}/charts/backend-report/values.yaml
      
      echo "=== Updated backend-report values.yaml ==="
      cat ${CHART_DIR}/charts/backend-report/values.yaml
      echo "========================================="
      
      # Переходим в директорию сабчарта backend-report
      cd ${CHART_DIR}/charts/backend-report
      
      # Пакетируем сабчарт backend-report отдельно
      helm package . -d ../../../ --version $VERSION
      
      # Возвращаемся в корневую директорию
      cd ../../../
      
      # Проверяем что файл создался
      ls -la *.tgz
      echo "Backend-report chart packaged: backend-report-${VERSION}.tgz"
      
      # Загружаем backend-report chart в Nexus
      echo "Uploading backend-report chart to Nexus..."
      curl -v -u ${NEXUS_REPO_USER}:${NEXUS_REPO_PASS} \
        ${HELM_REPO_URL} \
        --upload-file backend-report-${VERSION}.tgz

      echo "Backend-report chart uploaded successfully!"
  artifacts:
    paths:
      - backend-report-${VERSION}.tgz
    expire_in: 1 week
  only:
    changes:
      - sausage-store-chart/charts/backend-report/**/*
      - backend-report/**/*

telegram-notification-backend-report:
  stage: notify
  needs: ["package-and-upload-backend-report"]
  script:
    - |
      MESSAGE="✅ std-ext-010-34 задеплоил backend-report версии $VERSION через Helm

      📦 Образ: ${CI_REGISTRY_IMAGE}/sausage-backend-report:$VERSION
      📊 Chart: nexus/backend-report:$VERSION
      🚀 Pipeline: $CI_PIPELINE_URL
      🎯 Namespace: std-ext-010-34
      🔌 NodePort: 30082
      📈 HPA: включен (2-5 реплик)"

      echo "=== TELEGRAM MESSAGE CONTENT ==="
      echo "$MESSAGE"
      echo "=== END MESSAGE ==="
      
    - |
      curl -X POST -H "Content-type: application/json" \
        --data "{\"chat_id\": \"$CHAT_ID\", \"text\": \"$MESSAGE\"}" \
        https://api.telegram.org/bot$BOT_TOKEN/sendMessage
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /send notification/