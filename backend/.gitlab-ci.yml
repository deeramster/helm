cache:
  paths:
    - ${CI_PROJECT_DIR}/.m2/repository

variables:
  VERSION: 1.0.${CI_PIPELINE_ID}
  MAVEN_REPO_PATH: ${CI_PROJECT_DIR}/.m2/repository
  JAVA_OPTS: -XX:MaxRAMPercentage=90

stages:
  - build
  - test
  - release
  - deploy
  - notify

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/backend"
      --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/sausage-backend:$CI_COMMIT_SHA"
      --build-arg VERSION=$VERSION
      --cache=true

sonarqube-backend-sast:
  stage: test
  image: maven:3.8-openjdk-16
  variables:
    SPRING_FLYWAY_ENABLED: false
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.m2/repository"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - cd backend
    - mvn verify sonar:sonar
      -Dsonar.qualitygate.wait=true
      -Dsonar.projectKey=$SONAR_PROJECT_KEY_BACK
      -Dsonar.projectName=${SONAR_PROJECT_NAME}BACKEND
      -Dsonar.host.url=$SONARQUBE_URL
      -Dsonar.login=$SONAR_LOGIN
      -Dspring.datasource.url=${TEST_DB}
      -Dspring.datasource.username=sa
      -Dspring.datasource.password=${TEST_PASS}
  allow_failure: true

gitlab-sast:
  stage: test
  needs:
    - build
  trigger:
    include:
      - template: Security/SAST.gitlab-ci.yml

release:
  variables:
    GIT_STRATEGY: none
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  stage: release
  before_script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - crane tag $CI_REGISTRY_IMAGE/sausage-backend:$CI_COMMIT_SHA $VERSION

deploy-backend:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: production/backend
  when: manual
  script:
    - apt update && apt gettext -y
    - envsubst < "${CI_PROJECT_DIR}/kubernetes/backend/deployment.yaml" > "${CI_PROJECT_DIR}/kubernetes/backend/deployment-${CI_JOB_NAME}.yaml"
    - envsubst < "${CI_PROJECT_DIR}/kubernetes/backend/secrets.yaml" > "${CI_PROJECT_DIR}/kubernetes/backend/secrets-${CI_JOB_NAME}.yaml"
    - mkdir -p ~/.kube/
    - echo "$KUBECONFIG" >> ~/.kube/config
    - export KUBECONFIG=~/.kube/config
    - kubectl config use-context $(kubectl config current-context)
    - kubectl apply -f ./kubernetes/backend/secrets-${CI_JOB_NAME}.yaml
    - kubectl apply -f ./kubernetes/backend/deployment-${CI_JOB_NAME}.yaml
    - kubectl apply -f ./kubernetes/backend/service.yaml
    - rm ~/.kube/config
  only:
    changes:
      - kubernetes/*

telegram-notification-backend:
  stage: notify
  script:
    - LINK=$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/download?file_type=archive
    - |
      curl -X POST -H "Content-type: application/json" \
        --data '{"chat_id": "'$CHAT_ID'", "text": "std-ext-010-34 собрал и протестировал backend. Скачать артефакт: '$LINK'"}' \
        https://api.telegram.org/bot$BOT_TOKEN/sendMessage
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /send notification/
