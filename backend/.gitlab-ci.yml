cache:
  paths:
    - ${CI_PROJECT_DIR}/.m2/repository

variables:
  VERSION: 1.0.${CI_PIPELINE_ID}
  MAVEN_REPO_PATH: ${CI_PROJECT_DIR}/.m2/repository
  JAVA_OPTS: -XX:MaxRAMPercentage=90

stages:
  - build
  - test
  - release
  - package-chart
  - deploy
  - notify

build-backend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/backend"
      --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/sausage-backend:$CI_COMMIT_SHA"
      --build-arg VERSION=$VERSION
      --cache=true
  only:
    changes:
      - backend/**/*

sonarqube-backend-sast:
  stage: test
  image: maven:3.8-openjdk-16
  needs: ["build-backend"]
  variables:
    SPRING_FLYWAY_ENABLED: false
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.m2/repository"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - cd backend
    - mvn verify sonar:sonar
      -Dsonar.qualitygate.wait=true
      -Dsonar.projectKey=$SONAR_PROJECT_KEY_BACK
      -Dsonar.projectName=${SONAR_PROJECT_NAME}BACKEND
      -Dsonar.host.url=$SONARQUBE_URL
      -Dsonar.login=$SONAR_LOGIN
      -Dspring.datasource.url=${TEST_DB}
      -Dspring.datasource.username=sa
      -Dspring.datasource.password=${TEST_PASS}
  allow_failure: true
  only:
    changes:
      - backend/**/*

gitlab-sast:
  stage: test
  needs:
    - build-backend
  trigger:
    include:
      - template: Security/SAST.gitlab-ci.yml
  only:
    changes:
      - backend/**/*

release-backend:
  variables:
    GIT_STRATEGY: none
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  stage: release
  before_script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - crane tag $CI_REGISTRY_IMAGE/sausage-backend:$CI_COMMIT_SHA $VERSION
  needs: ["build-backend"]
  only:
    changes:
      - backend/**/*

package-and-upload-backend:
  stage: package-chart
  image: alpine/helm:latest
  needs: ["release-backend"]
  before_script:
    - apk add --no-cache curl gettext yq
  script:
    - |
      CHART_DIR="sausage-store-chart"
      
      # Обновляем версии в сабчарте backend
      yq eval ".version = \"$VERSION\"" -i ${CHART_DIR}/charts/backend/Chart.yaml
      yq eval ".appVersion = \"$VERSION\"" -i ${CHART_DIR}/charts/backend/Chart.yaml
      
      yq eval ".image.repository = \"${CI_REGISTRY_IMAGE}/sausage-backend\"" -i ${CHART_DIR}/charts/backend/values.yaml
      yq eval ".image.tag = \"$VERSION\"" -i ${CHART_DIR}/charts/backend/values.yaml
      yq eval ".image.pullPolicy = \"IfNotPresent\"" -i ${CHART_DIR}/charts/backend/values.yaml
      
      # Обновляем секреты (если нужно)
      yq eval ".secrets.springDatasourceUrl = \"${SPRING_DATASOURCE_URL}\"" -i ${CHART_DIR}/charts/backend/values.yaml
      yq eval ".secrets.postgresUser = \"${PSQLUSER}\"" -i ${CHART_DIR}/charts/backend/values.yaml
      yq eval ".secrets.postgresPassword = \"${PSQLPASSWORD}\"" -i ${CHART_DIR}/charts/backend/values.yaml
      yq eval ".secrets.mongoUser = \"${MONGO_USER}\"" -i ${CHART_DIR}/charts/backend/values.yaml
      yq eval ".secrets.mongoPassword = \"${MONGO_PASSWORD}\"" -i ${CHART_DIR}/charts/backend/values.yaml
      yq eval ".secrets.mongoHost = \"${MONGO_HOST}\"" -i ${CHART_DIR}/charts/backend/values.yaml
      yq eval ".secrets.mongoDbName = \"${MONGO_DBNAME}\"" -i ${CHART_DIR}/charts/backend/values.yaml
      
      echo "=== Updated values.yaml ==="
      cat ${CHART_DIR}/charts/backend/values.yaml
      echo "==========================="
      
      # Переходим в директорию сабчарта backend
      cd ${CHART_DIR}/charts/backend
      
      # Пакетируем сабчарт backend отдельно
      helm package . -d ../../../ --version $VERSION
      
      # Возвращаемся в корневую директорию
      cd ../../../
      
      # Проверяем что файл создался
      ls -la *.tgz
      echo "Backend chart packaged: backend-${VERSION}.tgz"
      
      # Загружаем backend chart в Nexus
      echo "Uploading backend chart to Nexus..."
      curl -v -u ${NEXUS_REPO_USER}:${NEXUS_REPO_PASS} \
        ${HELM_REPO_URL} \
        --upload-file backend-${VERSION}.tgz

      echo "Backend chart uploaded successfully!"
  artifacts:
    paths:
      - backend-${VERSION}.tgz
    expire_in: 1 week
  only:
    changes:
      - sausage-store-chart/charts/backend/**/*
      - backend/**/*


telegram-notification-backend:
  stage: notify
  needs: ["package-and-upload-backend"]
  script:
    - |
      MESSAGE="✅ std-ext-010-34 задеплоил backend версии $VERSION через Helm

      📦 Образ: ${CI_REGISTRY_IMAGE}/sausage-backend:$VERSION
      📊 Chart: nexus/backend:$VERSION
      🚀 Pipeline: $CI_PIPELINE_URL
      🎯 Namespace: std-ext-010-34
      🔌 NodePort: 30081"

      echo "=== TELEGRAM MESSAGE CONTENT ==="
      echo "$MESSAGE"
      echo "=== END MESSAGE ==="
      
    - |
      curl -X POST -H "Content-type: application/json" \
        --data "{\"chat_id\": \"$CHAT_ID\", \"text\": \"$MESSAGE\"}" \
        https://api.telegram.org/bot$BOT_TOKEN/sendMessage
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /send notification/