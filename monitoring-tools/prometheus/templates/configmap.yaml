---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-conf
  namespace: {{ .Release.Namespace }}
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s
      external_labels:
        cluster: 'momo-store'
        environment: '{{ .Release.Namespace }}'
    
    rule_files:
      - "/config/*.yaml"
    
    alerting:
      alertmanagers:
      - scheme: http
        timeout: 10s
        api_version: v2
        static_configs:
        - targets:
          - "alertmanager:9093"
    
    scrape_configs:
    # Сбор метрик с подов Kubernetes через аннотации
    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - {{ .Release.Namespace }}
      
      relabel_configs:
      # Оставляем только поды с аннотацией prometheus.io/scrape: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      
      # Используем порт из аннотации prometheus.io/port
      - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      
      # Используем путь из аннотации prometheus.io/path
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
        replacement: $1
      
      # Если путь не указан, используем /metrics по умолчанию
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: ^$
        replacement: /metrics
      
      # Добавляем ВСЕ метки из Kubernetes (включая app.kubernetes.io/*)
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
        replacement: $1
      
      # Специально добавляем метку app из app.kubernetes.io/name
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: replace
        target_label: app
      
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
      
      - source_labels: [__meta_kubernetes_pod_node_name]
        action: replace
        target_label: kubernetes_node
      
      # Добавляем component из меток
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        action: replace
        target_label: component
      
      # Добавляем project label
      - action: replace
        target_label: project
        replacement: momo_store
    
    # Сбор метрик с сервисов
    - job_name: 'kubernetes-services'
      kubernetes_sd_configs:
      - role: service
        namespaces:
          names:
          - {{ .Release.Namespace }}
      
      relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
        action: replace
        target_label: __scheme__
        regex: (https?)
      
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      
      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
      
      - action: labelmap
        regex: __meta_kubernetes_service_label_(.+)
      
      - source_labels: [__meta_kubernetes_namespace]
        target_label: kubernetes_namespace
      
      - source_labels: [__meta_kubernetes_service_name]
        target_label: kubernetes_name
    
    # Сбор собственных метрик Prometheus
    - job_name: 'prometheus'
      static_configs:
      - targets: ['localhost:9090']
        labels:
          app: 'prometheus'
    
    # Сбор метрик Alertmanager
    - job_name: 'alertmanager'
      static_configs:
      - targets: ['alertmanager:9093']
        labels:
          app: 'alertmanager'
    
    {{- if .Values.yandex_cloud_services }}
    # Сбор метрик из Yandex Cloud Monitoring
    {{- range $yandex := .Values.yandex_cloud_services }}
    - job_name: 'yandex_{{ $yandex.service }}'
      metrics_path: '/monitoring/v2/prometheusMetrics'
      params:
        folderId:
        - {{ $yandex.folderId }}
        service:
        - {{ $yandex.service }}
      scrape_interval: {{ $yandex.scrape_interval | default "60s" }}
      scrape_timeout: 30s
      bearer_token: {{ $yandex.bearer_token }}
      static_configs:
      - targets: ['monitoring.api.cloud.yandex.net']
        labels:
          folderId: {{ $yandex.folderId }}
          service: {{ $yandex.service }}
          serviceId: {{ $yandex.serviceId }}
    {{- end }}
    {{- end }}