stages:
  - build
  - test
  - release
  - package-chart
  - deploy
  - notify

variables:
  VERSION: 1.0.${CI_PIPELINE_ID}

cache:
  paths:
    - frontend/dist

build-frontend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/frontend"
      --dockerfile "${CI_PROJECT_DIR}/frontend/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/momo-store-frontend:$CI_COMMIT_SHA"
      --build-arg VERSION=$VERSION
      --cache=true
  only:
    changes:
      - frontend/**/*

sonarqube-frontend-sast:
  stage: test
  needs: ["build-frontend"]
  script:
    - cd frontend
    - npm install -g sonarqube-scanner
    - >
      sonar-scanner
      -Dsonar.projectKey=$SONAR_PROJECT_KEY_FRONT
      -Dsonar.projectName=${SONAR_PROJECT_NAME}FRONTEND
      -Dsonar.sources=.
      -Dsonar.host.url=$SONARQUBE_URL
      -Dsonar.login=$SONAR_LOGIN
  allow_failure: true
  only:
    changes:
      - frontend/**/*

gitlab-sast:
  stage: test
  needs: ["build-frontend"]
  trigger:
    include:
      - template: Security/SAST.gitlab-ci.yml
  only:
    changes:
      - frontend/**/*

release-frontend:
  variables:
    GIT_STRATEGY: none
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  stage: release
  before_script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - crane tag $CI_REGISTRY_IMAGE/momo-store-frontend:$CI_COMMIT_SHA $VERSION
  needs: ["build-frontend"]
  only:
    changes:
      - frontend/**/*

package-and-upload-frontend:
  stage: package-chart
  image: alpine/helm:latest
  needs: ["release-frontend"]
  before_script:
    - apk add --no-cache curl gettext yq
  script:
    - |
      CHART_DIR="momo-store-chart"
      
      yq eval ".version = \"$VERSION\"" -i ${CHART_DIR}/charts/frontend/Chart.yaml
      yq eval ".appVersion = \"$VERSION\"" -i ${CHART_DIR}/charts/frontend/Chart.yaml
      
      yq eval ".image.repository = \"${CI_REGISTRY_IMAGE}/momo-store-frontend\"" -i ${CHART_DIR}/charts/frontend/values.yaml
      yq eval ".image.tag = \"$VERSION\"" -i ${CHART_DIR}/charts/frontend/values.yaml
      yq eval ".image.pullPolicy = \"IfNotPresent\"" -i ${CHART_DIR}/charts/frontend/values.yaml

      yq eval ".ingress.hosts[0].host = \"momo.app.alimov.me\"" -i ${CHART_DIR}/charts/frontend/values.yaml
      yq eval ".ingress.tls[0].hosts[0] = \"momo.app.alimov.me\"" -i ${CHART_DIR}/charts/frontend/values.yaml
      
      yq eval '.imagePullSecrets[0].name = "docker-config-secret"' -i ${CHART_DIR}/charts/frontend/values.yaml
      
      yq eval ".service.targetPort = 8080" -i ${CHART_DIR}/charts/frontend/values.yaml
      
      echo "=== Updated frontend values.yaml ==="
      cat ${CHART_DIR}/charts/frontend/values.yaml
      echo "==================================="
      
      cd ${CHART_DIR}/charts/frontend
      
      helm package . -d ../../../ --version $VERSION
      
      cd ../../../
      
      ls -la *.tgz
      echo "Frontend chart packaged: frontend-${VERSION}.tgz"
      
      echo "Uploading frontend chart to Nexus..."
      curl -v -u ${NEXUS_REPO_USER}:${NEXUS_REPO_PASS} \
        ${HELM_REPO_URL} \
        --upload-file frontend-${VERSION}.tgz

      echo "Frontend chart uploaded successfully!"
  artifacts:
    paths:
      - frontend-${VERSION}.tgz
    expire_in: 1 week
  only:
    changes:
      - momo-store-chart/charts/frontend/**/*
      - frontend/**/*

deploy-frontend:
  stage: deploy
  image: alpine/helm:latest
  needs: ["package-and-upload-frontend"]
  when: manual
  before_script:
    - apk add --no-cache curl
    - mkdir -p ~/.kube/
    - echo "$KUBECONFIG" >> ~/.kube/config
    - export KUBECONFIG=~/.kube/config
  script:
    - |
      helm repo add nexus ${HELM_REPO_URL} --username ${NEXUS_REPO_USER} --password ${NEXUS_REPO_PASS}
      helm repo update
      echo "Deploying frontend version $VERSION to namespace momo"
      helm upgrade --install frontend nexus/frontend \
        --version $VERSION \
        --namespace momo \
        --create-namespace \
        --atomic \
        --timeout 5m
      
      echo "Frontend deployed successfully!"
  environment:
    name: production
    url: https://momo.app.alimov.me
  after_script:
    - rm -f ~/.kube/config
  only:
    changes:
      - momo-store-chart/charts/frontend/**/*
      - frontend/**/*

telegram-notification-frontend:
  stage: notify
  needs: ["deploy-frontend"]
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      MESSAGE="✅ momo задеплоил frontend версии $VERSION через Helm

      📦 Образ: ${CI_REGISTRY_IMAGE}/momo-store-frontend:$VERSION
      📊 Chart: nexus/frontend:$VERSION
      🚀 Pipeline: $CI_PIPELINE_URL
      🎯 Namespace: momo
      🌐 URL: https://momo.app.alimov.me"

      echo "=== TELEGRAM MESSAGE CONTENT ==="
      echo "$MESSAGE"
      echo "=== END MESSAGE ==="
      
    - |
      curl -X POST -H "Content-type: application/json" \
        --data "{\"chat_id\": \"$CHAT_ID\", \"text\": \"$MESSAGE\"}" \
        https://api.telegram.org/bot$BOT_TOKEN/sendMessage
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /send notification/